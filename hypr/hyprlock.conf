background {
    monitor =
    path = screenshot          # Blurs the current screen as background
    blur_passes = 3
    blur_size = 7
    noise = 0.012
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 280, 60
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1

    outer_color    = rgba(89b4facc)
    inner_color    = rgba(1e1e2eee)
    font_color     = rgb(205, 214, 244)
    fade_on_empty  = true
    fade_timeout   = 1000

    placeholder_text = <span foreground="##cdd6f4"><i>Enter password...</i></span>
    hide_input       = false
    rounding         = 12

    check_color      = rgba(a6e3a1cc)
    fail_color       = rgba(f38ba8cc)
    fail_text        = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition  = 300

    position = 0, -80
    halign   = center
    valign   = center
}

# Time
label {
    monitor =
    text      = $TIME12
    color     = rgba(205, 214, 244, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position  = 0, 200
    halign    = center
    valign    = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %B %d')"
    color       = rgba(180, 190, 254, 0.8)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    position    = 0, 110
    halign      = center
    valign      = center
}

# User
label {
    monitor =
    text = 
    color       = rgba(137, 180, 250, 0.9)
    font_size   = 16
    font_family = JetBrainsMono Nerd Font
    position    = 0, -20
    halign      = center
    valign      = center
}
